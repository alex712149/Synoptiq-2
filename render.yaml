services:
  - type: web
    name: synoptiq-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SYNOPTIQ_MODE
        value: real
      - key: DATABASE_URL
        fromDatabase:
          name: synoptiq-postgres
          property: connectionString
      - key: SYNOPTIQ_MODEL_VERSION
        sync: false
      - key: SYNOPTIQ_CORS_ORIGINS
        sync: false
      - key: NASA_EARTHDATA_USERNAME
        sync: false
      - key: NASA_EARTHDATA_PASSWORD
        sync: false

  - type: cron
    name: synoptiq-latest-cycle
    runtime: python
    rootDir: .
    schedule: "0 */6 * * *"
    buildCommand: pip install -r backend/requirements.txt -r training/requirements.txt
    startCommand: python training/ingest_latest_cycle.py
    envVars:
      - key: SYNOPTIQ_MODE
        value: real
      - key: DATABASE_URL
        fromDatabase:
          name: synoptiq-postgres
          property: connectionString
      - key: SYNOPTIQ_MODEL_VERSION
        sync: false
      - key: NASA_EARTHDATA_USERNAME
        sync: false
      - key: NASA_EARTHDATA_PASSWORD
        sync: false

databases:
  - name: synoptiq-postgres
    plan: free
